version: "3.9"

services:

  postgres:

    image: postgres:16

    container_name: devflow-postgres

    restart: always

    environment:
      POSTGRES_DB: devflow
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 89327934

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:

  postgres_data: