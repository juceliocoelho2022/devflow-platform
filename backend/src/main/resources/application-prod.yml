spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
app:
  jwt:
    secret: ${JWT_SECRET}
  cors-origin: ${CORS_ORIGIN}
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
server:
  error:
    include-message: never
    include-stacktrace: never
