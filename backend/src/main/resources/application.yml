spring:
  profiles:
    default: dev
  application:
    name: devflow-api
  datasource:
    url: jdbc:h2:mem:devflow;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  flyway:
    enabled: false
server:
  port: 8080
app:
  jwt:
    secret: ${JWT_SECRET:}
    expiration-ms: 86400000
  cors-origin: ${CORS_ORIGIN:http://localhost:5173,http://localhost:3000}
springdoc:
  swagger-ui:
    path: /swagger-ui.html
